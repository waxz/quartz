	location /quartz/ {
	
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_set_header Authorization "";

		rewrite ^/quartz(/.*)$ $1 break;
		
		proxy_pass http://127.0.0.1:8000;
		
		# proxy_set_header Host $host:$server_port;  # Ensure Host contains port
		proxy_set_header Host $http_host;
		
		proxy_set_header X-Real-IP $remote_addr;
		
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		
		proxy_set_header X-Forwarded-Proto $scheme;
		
		# Inform the backend that it's under `/quartz/`
		
		proxy_set_header X-Script-Name /quartz;
		
		proxy_set_header X-Forwarded-Prefix /quartz;
		
		proxy_redirect off;
	
	}
